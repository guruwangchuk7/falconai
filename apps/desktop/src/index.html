<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falcon</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #0b0c10;
        color: #e6e8ee;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid #1c1f2a;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand { font-weight: 600; letter-spacing: 0.02em; }
      .pair { font-size: 12px; color: #9aa3b2; }
      /* Always-visible capture indicator (§12.4). */
      .capture {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-bottom: 1px solid #1c1f2a;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3f4b; transition: background 0.15s; }
      .dot.on { background: #ff4d4f; box-shadow: 0 0 8px #ff4d4f; }
      .meter { flex: 1; height: 8px; background: #14171f; border-radius: 6px; overflow: hidden; }
      .meter > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4f8cff, #8b5cff); transition: width 0.08s linear; }
      .cap-label { font-size: 12px; color: #9aa3b2; min-width: 74px; }
      main { flex: 1; overflow-y: auto; padding: 14px 18px; }
      .empty { color: #6b7280; font-style: italic; margin-top: 8px; }
      .utt { margin: 0 0 10px; }
      .utt .who { color: #8b5cff; font-weight: 600; margin-right: 6px; }
      .utt.ambiguous { opacity: 0.7; }
      .utt.ambiguous .who::after { content: " ~"; color: #9aa3b2; }
      .gap { color: #d98a3d; font-size: 12px; margin: 6px 0; }
      footer { padding: 10px 18px; border-top: 1px solid #1c1f2a; font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Falcon</span>
      <span class="pair" id="pair">Solo — not paired</span>
    </header>

    <div class="capture">
      <span class="dot" id="dot"></span>
      <span class="cap-label" id="capLabel">Mic off</span>
      <span class="meter"><i id="bar"></i></span>
    </div>

    <main>
      <div id="transcript"></div>
      <p class="empty" id="empty">Waiting to pair — the shared transcript will appear here.</p>
    </main>

    <footer>Text-only. Falcon never speaks. Raw audio is never stored.</footer>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
