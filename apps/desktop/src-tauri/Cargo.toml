[package]
name = "falcon-desktop"
version = "0.0.0"
edition = "2021"
description = "Falcon desktop client — captures the owner's mic (VAD-gated) and streams it to the session worker."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mic capture (T020). VAD here is a simple energy gate for the MVP; Silero VAD (ONNX) is the upgrade.
cpal = "0.15"
# Stream audio to the session worker + receive transcripts back (T021).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "falcon-desktop"
path = "src/main.rs"
