name: CI

on:
  push:
    branches: [main, '001-context-layer']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm from packageManager pin)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck all packages + tests
        run: |
          pnpm -r typecheck
          pnpm typecheck:tests
          pnpm typecheck:web-tests

  build:
    # Runs the REAL `next build` — CI previously only ran `tsc --noEmit` (misses App Router route-export
    # rules) and `next dev` for e2e (no production build), so a route file exporting a non-handler
    # binding slipped through until the pilot Docker build caught it. Needs no secrets (env is validated
    # lazily at request/boot, not at import). Required check for the pilot (specs/003 §4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Production build (@falcon/web)
        run: pnpm --filter @falcon/web build

  integration:
    # The isolation / ACL / partition-prune / pooling guards (SC-003, blocker-class) run against a
    # real pgvector Postgres via Testcontainers. ubuntu-latest ships Docker, so this actually
    # executes the RLS + partition-prune assertions on every push — no local Docker needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Integration guards (Testcontainers pgvector)
        run: pnpm test:integration

  e2e:
    # T028: authed Personal Falcon e2e. global-setup boots pgvector Postgres + Redis (Testcontainers)
    # and `next dev` with the offline FALCON_FAKE_LLM seam, then Playwright drives a signed-in ask →
    # grounded cited answer. Deterministic + keyless; ubuntu ships Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @falcon/web exec playwright install --with-deps chromium
      - name: Authed e2e (Testcontainers + next dev)
        run: pnpm --filter @falcon/web e2e:auth

  no-token-in-db:
    # T042 gate: OAuth tokens live in the dedicated secrets store, NEVER the app DB (R26). Fail the
    # build if any app-DB column looks like a raw token holder (secret_ref is the only allowed link).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no token columns in the schema or migration
        run: |
          if grep -RniE "(access_token|refresh_token|api_token|oauth_token|'.*token'.*text)" \
               packages/db/src/schema.ts packages/db/drizzle/*.sql; then
            echo "::error::Found a token-like column in the app DB. Tokens belong in the secrets store (R26)."
            exit 1
          fi
          echo "OK: no token columns in the app DB (secret_ref only)."
